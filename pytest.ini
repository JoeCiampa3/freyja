[pytest]
testpaths = tests checks
markers =
    check(id, tier): the check ID (CONVENTIONS section 3) and its tier, gate or advisory (section 7)
    fusion: needs Fusion running with its MCP server (Stage 3b); deselected unless --fusion or -m fusion is given
    slow: takes more than ten seconds; deselect with -m 'not slow'
    inputs(*paths): every repo path the result depends on; skipped while those files are unchanged since the test last passed (tools/testkit; --rerun-cached runs it)
