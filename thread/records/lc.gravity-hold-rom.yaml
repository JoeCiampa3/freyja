id: lc.gravity-hold-rom
independent_source_required: false
kind: load_case
notes: 'Not an impact or other contact transient: the loads come from rigid-body inverse dynamics at zero velocity on a gantry that holds the pelvis (no
  contact solver), so the simulation''s physics is not the untrusted part. It records the gravity-torque curve over each joint''s range. The 6 unlimited
  hinges are skipped, not invented: the thoracolumbar and cervicothoracic hinges are the template''s bare joints. The shoulder adduction limit is a
  deliberate zero (pose-dependent, a placeholder in the sheet), so that side of the shoulder abduction-adduction range has no width. Sweeping one joint at a time is near-worst, not a
  bound, for a proximal joint whose distal pose matters.'
purpose: Each limited joint swept through its range against gravity, one at a time, with the other joints at the reference pose and the pelvis held by the gantry.
schema: thread-record/1
source:
  scenario: rom_sweep
status: proposed
