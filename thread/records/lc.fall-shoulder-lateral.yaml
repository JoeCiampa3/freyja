notes: >-
  The energy is a design upper edge, not a measurement. "Sourced" means the cited decision exists and is accepted, not that its number is
  validated. The shoulder zone has no cap yet; the cap and stroke are set by the owning record (adr-0044 D3), rm.v1-shoulder-concept. No energy
  is shared between zones or between limbs without a verified source (adr-0037 D1(c)).
  540 J is the upper edge of the energy bound of adr-0037 D1(b), 473 to 537 J after its 2026-10-31 Revisions, rounded up to the next 10 J. No
  credit for leg buckling or bracing (adr-0036).
  The skin it strikes is the upper arm's, not the thorax's: at the shoulder joint centre station the thorax ledger's lateral ray ends on a
  cut plane and the shoulder's skin lies in upper_arm_R, 34.3 mm beyond the joint centre at station 40 (memo 59, finding 7), so its contact
  is seg.upper_arm while its zone stays housed in the thorax (adr-0045 D5(d)).
