# posture_sensitivity: how the static standing torques (stand_static) move with the CoM position over the ankle and with
# lumbosacral and thoracic flexion. PLACEHOLDER RANGES: no cited source for any of them, so nothing here says what a person
# does. The grid is a model sensitivity, not a recommended posture, and its minimum is a property of the model.
name: posture_sensitivity
base: stand_static
grid:
  com_x_rel_ankle_m: {start: -0.02, stop: 0.05, n: 8}
  lsj_fe_deg: {start: -10.0, stop: 20.0, n: 7}
  tj_fe_deg: {start: -10.0, stop: 20.0, n: 7}
# constraints: the defaults (support margin 0.02 m, limit margin 1.0 deg; see sim/scripts/sweep.py for why the limit margin is not 2.0)
