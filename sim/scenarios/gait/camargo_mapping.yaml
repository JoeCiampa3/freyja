# Camargo et al. 2021 (OpenSim IK/ID) -> Freyja joints. Authored. Signs are applied to angles, velocities and moments alike
# (a coordinate and its moment flip together, so power is unchanged).
#
# Dataset conventions (from the data itself; data/camargo2021/README.md has the evidence):
#   hip_flexion +flexion, hip_adduction +adduction, hip_rotation +internal, knee_angle NEGATIVE flexion (extension
#   positive), ankle_angle +dorsiflexion, subtalar_angle sign unverified. Angles in degrees, ID moments in N m.
#   Lab frame: x subject's right, y up, z backward (subject walks toward -z). Pelvis frame (OpenSim): x forward, y up, z right.
# Model conventions: every hinge positive in the flexion / adduction / internal-rotation / dorsiflexion / inversion
# direction named in checks/joint_polarity.yaml; the model's own axes handle the left-right mirror.
#
# `offset` (optional, degrees, default 0) is a constant added after the sign, in the model's own positive direction: the model's hinge angle is
# `sign * dataset angle + offset`, so for the ankle (positive dorsiflexion) a negative offset tips the foot toe-down. It records a convention
# difference between the dataset's OpenSim zero and Freyja's, not a gait feature, and is used for the ankle only (Stage 2e): the dataset's foot
# is flat on the plate when its ankle reads about 3.4 degrees less dorsiflexion than Freyja's flat-soled foot (memo12). Moments are not offset.
#
# `verified` names the T1 feature check that validates the sign (sim/scripts/gaitfeatures.py). `unverified` joints are
# still mapped with the sign shown; they are listed in the stage 2 report.
schema: camargo-mapping/1
frame:
  # model world (x anterior, y left, z up) from lab (x right, y up, z backward): rows are the model axes in lab coordinates.
  lab_to_model: [[0, 0, -1], [-1, 0, 0], [0, 1, 0]]
  # model pelvis frame (x anterior, y left, z up) from the OpenSim pelvis frame (x forward, y up, z right).
  osim_pelvis_to_model: [[1, 0, 0], [0, 0, -1], [0, 1, 0]]
  # OpenSim pelvis rotation order (parent-to-child): Rz(tilt) Rx(list) Ry(rotation), degrees.
  pelvis_euler: [pelvis_tilt, pelvis_list, pelvis_rotation]
  # In this lab the ground z axis points along the walking direction, so the dataset's `pelvis_tilt` (a rotation about ground z) is
  # the pelvis's ROLL (obliquity, an oscillation of a few degrees) and `pelvis_list` (about ground x, the subject's right) is its
  # sagittal PITCH. The names come from the OpenSim model's own axes, not from this setup. Positive pelvis_list rotates the top of
  # the pelvis backward, so anterior (forward) pitch, the model's flexion direction, is minus pelvis_list. The mean-pitch design
  # parameter acts on this coordinate only.
  pelvis_pitch: {coordinate: pelvis_list, sign: -1}
  # Anatomical meanings of the three pelvis coordinates in this lab frame (every record and the audit README use these names):
  #   pelvis_tilt      ROLL (obliquity): rotation about the walking axis; an oscillation of a few degrees, zero mean
  #   pelvis_list      sagittal PITCH: rotation about the subject's right; anterior pitch is minus pelvis_list
  #   pelvis_rotation  YAW: about the pelvis's own vertical axis; near 90 degrees because the lab z axis points backward
  pelvis_roll: {coordinate: pelvis_tilt, sign: 1}
  pelvis_yaw: {coordinate: pelvis_rotation, sign: 1}
joints:
  hip_fe_right:       {dataset: hip_flexion_r,    sign: 1,  verified: hip_extension_late_stance}
  hip_fe_left:        {dataset: hip_flexion_l,    sign: 1,  verified: hip_extension_late_stance}
  hip_aa_right:       {dataset: hip_adduction_r,  sign: 1,  verified: hip_adduction_stance}
  hip_aa_left:        {dataset: hip_adduction_l,  sign: 1,  verified: hip_adduction_stance}
  hip_ier_right:      {dataset: hip_rotation_r,   sign: 1,  verified: unverified}
  hip_ier_left:       {dataset: hip_rotation_l,   sign: 1,  verified: unverified}
  knee_right:         {dataset: knee_angle_r,     sign: -1, verified: knee_swing_peak}
  knee_left:          {dataset: knee_angle_l,     sign: -1, verified: knee_swing_peak}
  ankle_pdflex_right: {dataset: ankle_angle_r,    sign: 1,  offset: -3.4, verified: ankle_plantarflexed_toe_off}
  ankle_pdflex_left:  {dataset: ankle_angle_l,    sign: 1,  offset: -3.4, verified: ankle_plantarflexed_toe_off}
  ankle_ie_right:     {dataset: subtalar_angle_r, sign: 1,  verified: unverified}
  ankle_ie_left:      {dataset: subtalar_angle_l, sign: 1,  verified: unverified}
# Held at the standing pose from stand_static: every spine, neck and arm joint (lumbar channels in the dataset are zero).
held: [lsj_fe, lsj_lat, lsj_ax, tj_fe, tj_lat, tj_ax, cj_fe, cj_lat, cj_ax,
       shoulder_fe_right, shoulder_aa_right, shoulder_ier_right, elbow_right, wrist_right,
       shoulder_fe_left, shoulder_aa_left, shoulder_ier_left, elbow_left, wrist_left]
