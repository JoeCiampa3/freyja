# The roadmap's controlled tag vocabulary. Authored; Joe owns the values (CONVENTIONS section 2). Schema: docs/schemas/roadmap-tags-1.schema.json.
#
# A node tag is free (no colon: never checked) or namespaced (`region:arm`). A namespaced tag must name a namespace and value listed
# here, or the roadmap has an error; a node carrying two values of one namespace draws a warning. A value's colour is optional (null).
#
# The colours were chosen by `python analysis/tag_palette.py` and are checked by tests/test_roadmap_tags.py: each keeps 3:1 contrast with
# the viewer's light and dark backgrounds (so one hex serves both themes), and within a namespace and against the viewer's grey for "no tag"
# every pair stays apart under normal vision, protanopia, deuteranopia and tritanopia (CIE76 Delta E at least 12 for region, 20 for phase).
# Colour never carries meaning alone: the viewer also shows the value in a legend, in the drawer and on hover.
namespaces:
  region:
    head: "#e409fc"
    neck: "#f94b01"
    torso: "#9155ac"
    spine: "#7e6a2e"
    pelvis: "#cc6add"
    arm: "#5b7081"
    hand: "#18a825"
    leg: "#a75359"
    foot: "#6797b3"
    whole-body: "#bf835e"
  phase:
    spec: "#9029fa"
    sim: "#d27c06"
    design: "#9a5397"
    fab: "#be3d25"
    bench: "#e149ed"
    integrate: "#3da25b"
